apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-predictor-worker
  namespace: stock-forecasting
  labels:
    app.kubernetes.io/name: stock-predictor
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: stock-predictor
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-predictor
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: stock-predictor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outbox-worker
          image: stock-forecasting-platform:0.6.0
          imagePullPolicy: IfNotPresent
          args: ["worker", "--limit", "100", "--poll-seconds", "5"]
          envFrom:
            - configMapRef:
                name: stock-predictor-config
            - secretRef:
                name: stock-predictor-runtime-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime
              mountPath: /var/lib/stock-predictor
            - name: temporary
              mountPath: /tmp
            - name: identity
              mountPath: /run/secrets/identity
              readOnly: true
      terminationGracePeriodSeconds: 30
      volumes:
        - name: runtime
          emptyDir: {}
        - name: temporary
          emptyDir: {}
        - name: identity
          secret:
            secretName: stock-predictor-identity
            items:
              - key: jwt-public.pem
                path: jwt-public.pem
