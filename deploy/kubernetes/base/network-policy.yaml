apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stock-predictor-default-deny
  namespace: stock-forecasting
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stock-predictor-api-ingress
  namespace: stock-forecasting
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stock-predictor
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stock-predictor-egress
  namespace: stock-forecasting
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stock-predictor
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
