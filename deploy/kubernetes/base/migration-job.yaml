apiVersion: batch/v1
kind: Job
metadata:
  name: stock-predictor-migrate
  namespace: stock-forecasting
  labels:
    app.kubernetes.io/name: stock-predictor
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-predictor
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: stock-predictor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: stock-forecasting-platform:0.6.0
          args: ["db-upgrade"]
          envFrom:
            - configMapRef:
                name: stock-predictor-config
            - secretRef:
                name: stock-predictor-runtime-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
