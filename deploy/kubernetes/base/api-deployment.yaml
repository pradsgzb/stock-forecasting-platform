apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-predictor-api
  namespace: stock-forecasting
  labels:
    app.kubernetes.io/name: stock-predictor
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: stock-predictor
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-predictor
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: stock-predictor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: stock-forecasting-platform:0.6.0
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: stock-predictor-config
            - secretRef:
                name: stock-predictor-runtime-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime
              mountPath: /var/lib/stock-predictor
            - name: temporary
              mountPath: /tmp
            - name: identity
              mountPath: /run/secrets/identity
              readOnly: true
      terminationGracePeriodSeconds: 30
      volumes:
        - name: runtime
          emptyDir: {}
        - name: temporary
          emptyDir: {}
        - name: identity
          secret:
            secretName: stock-predictor-identity
            items:
              - key: jwt-public.pem
                path: jwt-public.pem
