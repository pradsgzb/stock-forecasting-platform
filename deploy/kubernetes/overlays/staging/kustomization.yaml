apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: stock-predictor-config
    behavior: merge
    literals:
      - SP_APP__ENVIRONMENT=staging
      - SP_API__DOCS_ENABLED=false
commonLabels:
  app.kubernetes.io/environment: staging
