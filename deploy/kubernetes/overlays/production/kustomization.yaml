apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: stock-predictor-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: stock-predictor-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
configMapGenerator:
  - name: stock-predictor-config
    behavior: merge
    literals:
      - SP_APP__ENVIRONMENT=production
      - SP_API__DOCS_ENABLED=false
commonLabels:
  app.kubernetes.io/environment: production
