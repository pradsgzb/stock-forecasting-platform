name: Controlled Delivery

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment receiving the immutable image
        required: true
        type: choice
        options: [integration, staging, production]
      execute:
        description: Apply to the configured Kubernetes environment after validation
        required: true
        type: boolean
        default: false
      rollback_image:
        description: Optional previously approved OCI image@sha256 digest
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: delivery-${{ inputs.target }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.5"

jobs:
  build:
    name: Verify and build immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Run locked release checks
        run: ./scripts/release-check.sh

      - name: Validate repository and deployment references
        run: uv run --locked python scripts/validate-repository.py

      - name: Generate release evidence inputs
        run: |
          set -Eeuo pipefail
          mkdir -p dist .local/release
          uv export --locked --all-groups --format cyclonedx1.5 \
            --output-file dist/dependencies.cdx.json
          tar -czf dist/deployment-bundle.tar.gz deploy infra docs/operations

      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/${REPOSITORY,,}:${GITHUB_SHA}"
          docker build --pull --tag "${IMAGE}" .
          docker push "${IMAGE}"
          REFERENCE="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}")"
          test -n "${REFERENCE}"
          printf '%s\n' "${REFERENCE}" > dist/container-image.txt
          echo "reference=${REFERENCE}" >> "${GITHUB_OUTPUT}"

      - name: Create and verify release manifest
        env:
          TARGET: ${{ inputs.target }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          set -Eeuo pipefail
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          with Path("pyproject.toml").open("rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )"
          uv run --locked stock-predictor release-manifest create \
            --version "${PACKAGE_VERSION}" \
            --git-commit "${GITHUB_SHA}" \
            --source-root . \
            --build-run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --artifact python_wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --artifact source_distribution="$(find dist -maxdepth 1 -name '*.tar.gz' ! -name 'deployment-*' -print -quit)" \
            --artifact dependency_sbom=dist/dependencies.cdx.json \
            --artifact container_image=dist/container-image.txt \
            --artifact deployment_bundle=dist/deployment-bundle.tar.gz \
            --gate tests=.local/test-results.xml \
            --gate coverage=coverage.xml \
            --gate security=release-check \
            --gate repository_validation=scripts/validate-repository.py \
            --output dist/release-manifest.json
          uv run --locked stock-predictor release-manifest verify \
            --manifest dist/release-manifest.json --artifact-root .
          DIGEST="${IMAGE_REFERENCE##*@sha256:}"
          case "${TARGET}" in
            integration) SOURCE_ARGS=() ;;
            staging) SOURCE_ARGS=(--source integration) ;;
            production) SOURCE_ARGS=(--source staging) ;;
          esac
          uv run --locked stock-predictor release-manifest plan \
            --manifest dist/release-manifest.json \
            "${SOURCE_ARGS[@]}" \
            --target "${TARGET}" \
            --image-digest "${DIGEST}" \
            --requested-by "github:${GITHUB_ACTOR}" \
            > dist/deployment-plan.json
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Attest release evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.json
            dist/*.txt
            dist/SHA256SUMS

      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlled-delivery-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Promote to ${{ inputs.target }}
    if: ${{ inputs.execute }}
    needs: build
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install deployment dependencies
        run: uv sync --locked --all-groups

      - name: Configure short-lived cluster context
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          test -n "${KUBECONFIG_B64}"
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"
          kubectl auth can-i get deployments --namespace stock-forecasting

      - name: Run migration and deploy workloads
        id: deploy
        continue-on-error: true
        env:
          TARGET: ${{ inputs.target }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: ./scripts/deploy-kubernetes.sh "${TARGET}" "${IMAGE}"

      - name: Roll back failed promotion
        if: steps.deploy.outcome == 'failure' && inputs.rollback_image != ''
        env:
          TARGET: ${{ inputs.target }}
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
        run: ./scripts/deploy-kubernetes.sh "${TARGET}" "${ROLLBACK_IMAGE}" --skip-migration

      - name: Fail after deployment or rollback handling
        if: steps.deploy.outcome == 'failure'
        run: exit 1
