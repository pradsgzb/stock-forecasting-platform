name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  UV_VERSION: "0.13.5"

jobs:
  release:
    name: Verify, build, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -Eeuo pipefail
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"

      - name: Run locked release checks
        run: ./scripts/release-check.sh

      - name: Generate dependency SBOM
        run: >-
          uv export --locked --all-groups
          --format cyclonedx1.5
          --output-file dist/dependencies.cdx.json

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz dependencies.cdx.json > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/dependencies.cdx.json
            dist/SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stock-forecasting-platform-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/dependencies.cdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.whl
          dist/*.tar.gz
          dist/dependencies.cdx.json
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
